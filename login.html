<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeCity ARQ · Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
  :root{--bg-0:#0a0d12;--bg-1:#11161e;--bg-2:#1a2230;--line:#2a3548;--text:#e6ecf5;--text-dim:#8b97aa;--accent:#f4b942;--ok:#6bd96b;--err:#ff5252;--mono:'JetBrains Mono',monospace;--display:'Space Grotesk',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
  body{background:radial-gradient(1200px 700px at 70% -10%,#16202e 0%,var(--bg-0) 55%),var(--bg-0);color:var(--text);font-family:var(--mono);display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:410px}
  .brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px}
  .brand .mark{width:34px;height:34px;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-weight:700;font-family:var(--display);transform:rotate(45deg)}
  .brand .mark span{transform:rotate(-45deg)}
  .brand h1{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.5px}
  .brand h1 b{color:var(--accent)}
  .card{background:linear-gradient(180deg,var(--bg-1),#0c1017);border:1px solid var(--line);border-radius:14px;padding:26px 24px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .tag{text-align:center;color:var(--text-dim);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field label{font-size:9px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase}
  .field input{background:var(--bg-0);border:1px solid var(--line);color:var(--text);padding:11px 12px;font-family:var(--mono);font-size:13px;border-radius:8px}
  .field input:focus{outline:none;border-color:var(--accent)}
  .submit{width:100%;padding:12px;background:var(--accent);color:#1a1305;border:0;border-radius:8px;font-family:var(--mono);font-weight:700;font-size:13px;cursor:pointer;transition:.15s;margin-top:4px}
  .submit:hover{background:#ffc857}
  .msg{margin-top:14px;font-size:11px;padding:10px 12px;border-radius:8px;display:none;line-height:1.5}
  .msg.show{display:block}
  .msg.err{background:rgba(255,82,82,.12);border:1px solid var(--err);color:#ffb3b3}
  .hint{margin-top:16px;font-size:10px;color:var(--text-dim);line-height:1.8}
  .hint b{color:var(--text)}
  .hint .u{cursor:pointer;color:var(--accent)} .hint .u:hover{text-decoration:underline}
  .foot{text-align:center;margin-top:18px;font-size:10px;color:var(--text-dim)}
  .foot b{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark"><span>LC</span></div><h1>Life<b>City</b> ARQ</h1></div>
  <div class="card">
    <div class="tag">Plataforma Colaborativa de Diseño MEP</div>
    <form id="frm">
      <div class="field"><label>Correo</label><input id="email" type="email" placeholder="ana@lifecity.com.co" autocomplete="username" required></div>
      <div class="field"><label>Contraseña</label><input id="pass" type="password" placeholder="••••••" autocomplete="current-password" required></div>
      <button class="submit" type="submit">Ingresar</button>
    </form>
    <div id="msg" class="msg err"></div>
    <div class="hint">
      <b>Cuentas demo</b> (clic para autocompletar):<br>
      <span class="u" data-e="ana@lifecity.com.co" data-p="electrico">⚡ Ana · Ing. Eléctrica</span><br>
      <span class="u" data-e="carlos@lifecity.com.co" data-p="hidro">≈ Carlos · Hidrosanitario</span><br>
      <span class="u" data-e="luis@lifecity.com.co" data-p="gas">🔥 Luis · Gas</span><br>
      <span class="u" data-e="admin@lifecity.com.co" data-p="admin">◆ Admin (edita todo)</span>
    </div>
  </div>
  <div class="foot">Life<b>City</b> · BIM Management Hub</div>
</div>
<script type="module">
  import Store from './js/store.js';
  await Store.ready;
  if (Store.currentUser()) location.replace('index.html');
  const frm = document.getElementById('frm'), msg = document.getElementById('msg');
  frm.addEventListener('submit', (e) => {
    e.preventDefault();
    const r = Store.login(document.getElementById('email').value, document.getElementById('pass').value);
    if (r.ok) { location.href = 'index.html'; }
    else { msg.textContent = r.error; msg.classList.add('show'); }
  });
  document.querySelectorAll('.hint .u').forEach(el => el.addEventListener('click', () => {
    document.getElementById('email').value = el.dataset.e;
    document.getElementById('pass').value = el.dataset.p;
  }));
</script>
</body>
</html>
